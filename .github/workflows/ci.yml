name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
      UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
      PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
      RUFF_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/ruff
      MYPY_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/mypy
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/app/tests/cache/pycache
      COVERAGE_FILE: ${{ github.workspace }}/app/tests/cache/coverage/.coverage
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/app/tests/cache/playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare development cache directories
        run: mkdir -p runtimes/cache/{uv,pip,npm} app/tests/cache/{ruff,mypy,pycache,coverage,playwright,pytest,pytest-basetemp,angular}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        working-directory: app/server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install '.[test]'

      - name: Compile backend modules
        working-directory: app/server
        run: .venv/bin/python -m compileall app.py api common configurations contracts repositories services

      - name: Ruff checks
        # Keep CI independent of ignored local ruff.toml files while retaining
        # the repository-local cache location used by the workflow.
        run: app/server/.venv/bin/python -m ruff check --isolated --cache-dir "$RUFF_CACHE_DIR" app/server app/tests

      - name: BasedPyright
        working-directory: app/server
        run: .venv/bin/python -m basedpyright

      - name: Initialize embedded database
        run: app/server/.venv/bin/python app/scripts/initialize_database.py

      - name: Unit tests
        run: app/server/.venv/bin/python -m pytest app/tests/unit -q

      - name: OpenAPI smoke
        run: app/server/.venv/bin/python -c "from server.app import app; app.openapi()"

  frontend-validation:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare development cache directory
        run: mkdir -p runtimes/cache/npm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm install --no-package-lock

      - name: Lint frontend
        working-directory: app/client
        run: npm run lint

      - name: Unit tests
        working-directory: app/client
        run: npm run test:unit

      - name: Build frontend
        working-directory: app/client
        run: npm run build
