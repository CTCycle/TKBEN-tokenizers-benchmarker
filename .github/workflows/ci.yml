name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: app
      UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
      PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
      RUFF_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/ruff
      MYPY_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/mypy
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/runtimes/cache/pycache
      COVERAGE_FILE: ${{ github.workspace }}/runtimes/cache/coverage/.coverage
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright
      MPLCONFIGDIR: ${{ github.workspace }}/runtimes/cache/matplotlib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Set up UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"

      - name: Install locked test dependencies
        run: uv sync --locked --project app/server --extra test

      - name: Compile backend modules
        run: uv run --project app/server python -m compileall app/server

      - name: Ruff checks
        run: uv run --project app/server ruff check --config app/server/pyproject.toml app/server app/tests

      - name: BasedPyright
        working-directory: app/server
        run: uv run basedpyright

      - name: Initialize embedded database
        run: uv run --project app/server python app/scripts/initialize_database.py

      - name: Unit tests
        run: uv run --project app/server python -m pytest -c app/tests/pytest.ini app/tests/unit -q

      - name: OpenAPI smoke
        run: uv run --project app/server python -c "from server.app import app; app.openapi()"

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Install frontend dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund

      - name: Lint frontend
        working-directory: app/client
        run: npm run lint

      - name: Unit tests
        working-directory: app/client
        run: npm run test:unit

      - name: Build frontend
        working-directory: app/client
        run: npm run build
