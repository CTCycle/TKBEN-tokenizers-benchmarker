[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "TKBEN"
version = "3.1.0"
requires-python = ">=3.14"
dependencies = [  
    "fastapi==0.128.0",
    "uvicorn[standard]>=0.40.0",
    "numpy==2.4.1",
    "pandas==3.0.0",
    "tqdm==4.67.1",
    "alembic==1.19.1",
    "SQLAlchemy==2.0.46",
    "pydantic-settings==2.11.0",
    "psycopg[binary]==3.3.1",
    "python-dotenv==1.2.1",  
    "python-multipart>=0.0.21",   
    "cryptography>=46.0.2",
    "transformers==4.57.3",
    "sentencepiece==0.2.1",
    "datasets==4.5.0",
    "sacremoses==0.1.1",   
    "hf-xet==1.1.10",  
    "matplotlib==3.10.8",
    "psutil>=6.1.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "ruff==0.15.9",
    "basedpyright==1.38.2"
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [".."]
version_table = "alembic_version"
version_table_pk = true
