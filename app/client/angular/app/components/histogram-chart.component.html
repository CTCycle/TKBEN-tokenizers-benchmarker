<div class="dataset-histogram-chart" role="img" [attr.aria-label]="label()">
  <svg viewBox="0 0 640 190" preserveAspectRatio="none" aria-hidden="true"><line x1="28" y1="166" x2="632" y2="166" stroke="currentColor" stroke-opacity=".26" />@for (count of histogram().counts; track $index) { <rect [attr.x]="34 + $index * (590 / math.max(histogram().counts.length, 1))" [attr.y]="166 - (count / maxCount()) * 130" [attr.width]="math.max(3, 560 / math.max(histogram().counts.length, 1))" [attr.height]="(count / maxCount()) * 130" rx="2" class="dataset-histogram-bar"><title>{{ histogram().bins[$index] || $index }}: {{ count }}</title></rect> }</svg>
</div>
