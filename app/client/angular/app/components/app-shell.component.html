<div class="app-shell">
  <header class="app-header-bar">
    <div class="app-brand">
      <img class="app-brand-mark" src="/tkben-logo.png" alt="" aria-hidden="true" />
      <div class="app-brand-copy">
        <span class="app-brand-name">TKBEN</span>
        <span class="app-brand-subtitle">Tokenizer Benchmarker</span>
      </div>
    </div>

    <nav class="app-tab-nav" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <button
          type="button"
          class="app-tab"
          [routerLink]="item.path"
          routerLinkActive="app-tab--active"
          [routerLinkActiveOptions]="{ exact: false }"
          #active="routerLinkActive"
          [attr.aria-current]="active.isActive ? 'page' : null"
        >
          <span class="app-tab-icon">
            @switch (item.icon) {
              @case ('datasets') {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="4" rx="1.5" />
                  <rect x="3" y="10" width="18" height="4" rx="1.5" />
                  <rect x="3" y="16" width="18" height="4" rx="1.5" />
                </svg>
              }
              @case ('tokenizers') {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="8" cy="8" r="3" />
                  <circle cx="16" cy="8" r="3" />
                  <rect x="6" y="13" width="12" height="7" rx="2" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="4" width="7" height="7" rx="1.5" />
                  <rect x="13" y="4" width="7" height="7" rx="1.5" />
                  <rect x="4" y="13" width="7" height="7" rx="1.5" />
                  <rect x="13" y="13" width="7" height="7" rx="1.5" />
                </svg>
              }
            }
          </span>
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>

    <div class="app-header-actions">
      <a
        class="icon-button subtle app-header-settings-button"
        routerLink="/settings"
        routerLinkActive="accent"
        [routerLinkActiveOptions]="{ exact: true }"
        #settingsActive="routerLinkActive"
        [class.accent]="settingsActive.isActive"
        aria-label="Open settings"
        title="Settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </a>
    </div>
  </header>

  <div class="app-main">
    <section class="app-content">
      <ng-content />
    </section>
  </div>

</div>
